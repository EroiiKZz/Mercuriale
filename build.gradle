plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	mavenCentral()
	maven { name = 'Terraformers'; url = 'https://maven.terraformersmc.com/releases' }
}

loom {
	splitEnvironmentSourceSets()

	accessWidenerPath = file("src/main/resources/mercuriale.accesswidener")

	runs {
		client {
			programArgs '--width', '1920', '--height', '1080', '--fullscreen'
		}
	}

	mods {
		"mercuriale" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	compileOnly files(fileTree(dir: "$projectDir/../Vitrine/versions/26.2/build/libs", include: 'vitrine-*.jar', exclude: '*-sources.jar').files.sort { it.lastModified() }.last())
	compileOnly files(fileTree(dir: "$projectDir/../Lookup/versions/26.2/build/libs", include: 'chestradar-*.jar', exclude: '*-sources.jar').files.sort { it.lastModified() }.last())

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	testLogging { events "passed", "skipped", "failed" }
}

processResources {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	def version = project.version
	def minecraftDependency = project.minecraft_dependency
	def javaDependency = project.java_dependency
	inputs.property "version", version
	inputs.property "minecraft_dependency", minecraftDependency
	inputs.property "java_dependency", javaDependency
	filesMatching("fabric.mod.json") {
		expand "version": version,
			"minecraft_dependency": minecraftDependency,
			"java_dependency": javaDependency
	}
}

base {
	archivesName = 'mercuriale'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

tasks.register('build21') {
	group = 'build'
	description = 'Builds the Minecraft 1.21.1 to 1.21.10 jars from versions/.'
	dependsOn gradle.includedBuilds.findAll { it.name.startsWith('mercuriale-1.21') }.collect { it.task(':build') }
}

tasks.register('buildAll') {
	group = 'build'
	description = 'Builds the 26.2 jar and every 1.21.x jar.'
	dependsOn tasks.named('build'), tasks.named('build21')
}

ext.aeternumRoot = "$projectDir/../aeternum"
ext.aeternumPackage = 'mercuriale'
ext.aeternumMainClass = 'Mercuriale'
ext.aeternumClientVariant = '26.2'
apply from: "$projectDir/../aeternum/aeternum.gradle"
