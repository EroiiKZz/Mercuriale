pluginManagement {
	repositories {
		maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'mercuriale'

file('versions').listFiles()
	.findAll { new File(it, 'gradle.properties').isFile() }
	.each { dir ->
		includeBuild(dir) {
			name = "mercuriale-${dir.name}"
		}
	}
